const GROUP_META = {
  clear_complaint_low_rating:{label:'명확한 불만 (저평점)',cls:'b-group-cc'},
  mixed_or_partial_rating4:{label:'복합/부분 불만 (4점)',cls:'b-group-mp'},
  partial_complaint_in_rating5:{label:'5점 내 불만 포함',cls:'b-group-pc'},
  clear_non_complaint_rating5:{label:'불만 없음 (5점)',cls:'b-group-cn'},
  ambiguous_low_rating_topic_only:{label:'모호/토픽만 (저평점)',cls:'b-group-al'},
};

const STORAGE_KEY = 'labeling_' + MEMBER_NAME;
const TOTAL = REVIEWS.length;
let current = 0;
let labels = REVIEWS.map(() => ({}));
let notesArr = REVIEWS.map(() => '');

function loadFromStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const data = JSON.parse(saved);
      if (data.labels && data.labels.length === TOTAL) labels = data.labels;
      if (data.notesArr && data.notesArr.length === TOTAL) notesArr = data.notesArr;
      if (typeof data.current === 'number') current = data.current;
    }
  } catch(e) {}
}

let saveTimer = null;
function saveToStorage() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ labels, notesArr, current }));
      const ind = document.getElementById('save-indicator');
      ind.style.opacity = '1';
      setTimeout(() => ind.style.opacity = '0', 1200);
    } catch(e) {}
  }, 400);
}

function buildLabelGroups() {
  const container = document.getElementById('label-groups');
  container.innerHTML = '';
  LABEL_GROUPS.forEach(g => {
    const div = document.createElement('div');
    div.className = 'label-group';
    div.innerHTML = `<div class="label-section-title">${g.title}</div><div class="label-grid" id="grid-${g.group}"></div>`;
    container.appendChild(div);
    const grid = div.querySelector(`#grid-${g.group}`);
    g.labels.forEach(lbl => {
      const btn = document.createElement('button');
      btn.className = 'label-btn' + (labels[current][lbl.key] ? ' active' : '');
      btn.id = 'btn-' + lbl.key;
      btn.innerHTML = `<span class="label-chk">${labels[current][lbl.key] ? '✓' : ''}</span><span class="label-txt"><span class="label-name">${lbl.name}</span><span class="label-def">${lbl.def}</span></span>`;
      btn.onclick = () => toggleLabel(lbl.key, btn);
      grid.appendChild(btn);
    });
  });
}

function toggleLabel(key, btn) {
  labels[current][key] = !labels[current][key];
  btn.classList.toggle('active');
  btn.querySelector('.label-chk').textContent = labels[current][key] ? '✓' : '';
  updateProgress();
  saveToStorage();
}

function stars(n) {
  return Array.from({length:5}, (_, i) => `<span class="${i < n ? 'star-filled' : 'star-empty'}">★</span>`).join('');
}

function render() {
  const r = REVIEWS[current];
  document.getElementById('gold-id').textContent = r.gold_id;
  const gm = GROUP_META[r.candidate_group] || {label: r.candidate_group, cls: 'b-group-other'};
  const gb = document.getElementById('group-badge');
  gb.textContent = gm.label; gb.className = 'badge ' + gm.cls;
  document.getElementById('rating-badge').innerHTML = stars(r.rating) + ' ' + r.rating + '점';
  const cb = document.getElementById('contrast-badge');
  cb.style.display = r.has_contrast_marker ? '' : 'none';
  document.getElementById('prod-name').textContent = r.goods_name;
  const tags = [];
  if (r.brand_name) tags.push(r.brand_name);
  if (r.analysis_category) tags.push(r.analysis_category);
  if (r.option_text) tags.push(r.option_text);
  if (r.survey_size) tags.push('사이즈: ' + r.survey_size);
  if (r.survey_color) tags.push('색상: ' + r.survey_color);
  if (r.survey_thickness) tags.push('두께: ' + r.survey_thickness);
  if (r.survey_stretch) tags.push('신축: ' + r.survey_stretch);
  document.getElementById('prod-tags').innerHTML = tags.map(t => `<span class="ptag">${t}</span>`).join('');
  document.getElementById('review-text').textContent = r.content_norm;
  const hints = [];
  if (r.strong_complaint_matches) hints.push(`<span class="ht ht-strong">🔴 강: ${r.strong_complaint_matches}</span>`);
  if (r.weak_topic_matches) hints.push(`<span class="ht ht-weak">🟡 약: ${r.weak_topic_matches}</span>`);
  if (r.positive_matches) hints.push(`<span class="ht ht-pos">🟢 긍정: ${r.positive_matches}</span>`);
  const hrow = document.getElementById('hints-row');
  hrow.innerHTML = hints.length ? hints.join('') : '<span class="ht-empty">감지된 키워드 없음</span>';
  document.getElementById('notes').value = notesArr[current];
  buildLabelGroups();
  updateProgress();
}

function updateProgress() {
  const touched = labels.filter((l, i) => Object.values(l).some(Boolean) || notesArr[i].trim()).length;
  const pct = Math.round(touched / TOTAL * 100);
  document.getElementById('prog').style.width = pct + '%';
  document.getElementById('pct').textContent = touched + ' / ' + TOTAL + ' 처리됨';
  document.getElementById('done-msg').style.display = touched === TOTAL ? 'block' : 'none';
}

function saveCurrentNotes() {
  notesArr[current] = document.getElementById('notes').value;
}

function go(dir) {
  saveCurrentNotes();
  saveToStorage();
  const next = current + dir;
  if (next < 0 || next >= TOTAL) return;
  current = next;
  render();
  document.querySelector('.left-panel').scrollTop = 0;
  document.querySelector('.right-panel').scrollTop = 0;
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('notes').addEventListener('input', () => {
    notesArr[current] = document.getElementById('notes').value;
    saveToStorage();
  });
});

function exportCSV() {
  saveCurrentNotes();
  saveToStorage();
  const labelKeys = LABEL_GROUPS.flatMap(g => g.labels.map(l => l.key));
  const header = ['gold_id', 'labeler', ...labelKeys, 'label_notes'].join(',');
  const rows = REVIEWS.map((r, i) => {
    const vals = labelKeys.map(k => labels[i][k] ? 1 : 0);
    const note = (notesArr[i] || '').replace(/"/g, '""');
    return [r.gold_id, MEMBER_NAME, ...vals, `"${note}"`].join(',');
  });
  const csv = [header, ...rows].join('\n');
  const blob = new Blob(['\uFEFF' + csv], {type: 'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `goldset_labeled_${MEMBER_NAME}.csv`; a.click();
  URL.revokeObjectURL(url);
}

function resetAll() {
  if (!confirm('모든 라벨링 데이터를 초기화할까요? 이 작업은 되돌릴 수 없습니다.')) return;
  labels = REVIEWS.map(() => ({}));
  notesArr = REVIEWS.map(() => '');
  current = 0;
  localStorage.removeItem(STORAGE_KEY);
  render();
}

loadFromStorage();
render();

</script>
